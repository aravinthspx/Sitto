# Render Blueprint for the SITTO backend — FREE plan.
# Render dashboard → New → Blueprint → pick this repo. Secrets marked
# `sync: false` are asked for once during setup (see DEPLOYMENT.md).
#
# Free plan notes:
# - Background workers aren't available on the free plan, so the SeatSure
#   scheduler runs as a thread inside the API (RUN_SCHEDULER_IN_WEB).
# - Free services sleep after 15 minutes without traffic, which also pauses
#   the scheduler. .github/workflows/keep-alive.yml pings /health every
#   10 minutes to keep it awake (750 free hours/month covers one service 24/7).
# - For guaranteed SeatSure timing, switch `plan` to starter (paid) and move
#   the scheduler back to its own worker.

services:
  - type: web
    name: sitto-api
    runtime: python
    plan: free
    region: singapore        # closest Render region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Exactly one process: keeps the rate limiter accurate and ensures a
    # single scheduler thread
    startCommand: gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: RUN_SCHEDULER_IN_WEB
        value: "1"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: ALLOWED_ORIGINS        # your Vercel URL, e.g. https://sitto.vercel.app
        sync: false
      - key: FRONTEND_URL           # same as above
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        value: srmist.edu.in
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY           # Supabase secret / service-role key
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY       # python scripts/generate_vapid_keys.py
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT          # mailto:you@college.edu.in
        sync: false
      - key: PUSH_ACTION_SECRET
        generateValue: true
