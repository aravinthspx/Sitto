<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SITTO">
  <defs>
    <linearGradient id="sitto-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="0.55" stop-color="#5B3DF5"/>
      <stop offset="1" stop-color="#2BB8F0"/>
    </linearGradient>
    <radialGradient id="sitto-glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sitto-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sitto-seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E4FF"/>
    </linearGradient>
    <filter id="sitto-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E1150" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- iOS squircle -->
  <rect width="512" height="512" rx="114" fill="url(#sitto-bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#sitto-glow)"/>
  <path d="M114 0h284c63 0 114 51 114 114v58C430 214 340 236 256 236S82 214 0 172v-58C0 51 51 0 114 0z" fill="url(#sitto-gloss)"/>

  <!-- Seat glyph -->
  <g filter="url(#sitto-shadow)" fill="url(#sitto-seat)">
    <rect x="148" y="118" width="62" height="214" rx="31"/>
    <rect x="148" y="262" width="222" height="62" rx="31"/>
    <rect x="160" y="300" width="44" height="104" rx="22"/>
    <rect x="314" y="300" width="44" height="104" rx="22"/>
  </g>

  <!-- Availability dot -->
  <circle cx="352" cy="164" r="44" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="352" cy="164" r="30" fill="#22C55E"/>
  <circle cx="342" cy="153" r="9" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
